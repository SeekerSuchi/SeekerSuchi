<svg viewBox="0 0 720 110" width="720" height="110" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="110" fill="#0d1117"/>
  <rect x="24" y="8" width="672" height="96" rx="8" fill="#161b22" stroke="rgba(48,54,61,0.8)" stroke-width="0.5"/>
  <!-- Terminal window icon: rounded rect outline -->
  <rect x="36" y="36" width="22" height="18" rx="2" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <!-- > chevron inside -->
  <polyline points="41,42 45,45 41,48" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- _ underscore inside -->
  <line x1="47" y1="49" x2="52" y2="49" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Title -->
  <text x="66" y="50" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#ffffff">CLI Typing Game</text>
  <text x="682" y="50" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">2025</text>
  <!-- Desc -->
  <text x="38" y="72" font-family="ui-monospace,monospace" font-size="11.5" fill="#c9d1d9">Terminal typing game with difficulty &amp; practice modes using ANSI escape codes.</text>
  <!-- Tags -->
  <rect x="38" y="84" width="38" height="18" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="57" y="97" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#8b949e">Bash</text>
  <rect x="82" y="84" width="38" height="18" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="101" y="97" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#8b949e">ANSI</text>
  <rect x="126" y="84" width="44" height="18" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="148" y="97" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#8b949e">Linux</text>
</svg>
